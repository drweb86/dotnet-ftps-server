name: Publish NuGet Package

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish-nuget:
    runs-on: ubuntu-latest
    environment: nuget-publish
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Get version
        id: version
        run: |
          version=$(head -1 CHANGELOG.md | sed 's/^\xEF\xBB\xBF//' | sed 's/^# //')
          echo "version=$version" >> $GITHUB_OUTPUT
          echo "Version: $version"

      - name: Extract release notes
        run: |
          # Take the first CHANGELOG.md section (lines after the first "# version" header up to the next one),
          # skip the "(unpublished)" marker, and trim leading/trailing blank lines.
          mkdir -p output
          sed '1s/^\xEF\xBB\xBF//' CHANGELOG.md \
            | awk 'NR==1{next} /^# /{exit} /^\(unpublished\)[[:space:]]*$/{next}
                   /^[[:space:]]*$/{if(started)blank++; next}
                   {started=1; while(blank>0){print ""; blank--} print}' \
            > output/release-notes.md
          if [ ! -s output/release-notes.md ]; then
            echo "Error: no release notes found for the first CHANGELOG.md section"
            exit 1
          fi
          printf '\nFull changelog: https://github.com/drweb86/dotnet-ftps-server/blob/main/CHANGELOG.md\n' >> output/release-notes.md
          cat output/release-notes.md

      - name: Pack
        run: |
          v="${{ steps.version.outputs.version }}"
          dotnet pack sources/FtpsServerLibrary/FtpsServerLibrary.csproj \
            -c Release \
            -o output/nuget-package \
            "/p:PackageReleaseNotesFile=$GITHUB_WORKSPACE/output/release-notes.md" \
            "/p:InformationalVersion=$v" \
            "/p:VersionPrefix=$v" \
            "/p:Version=$v" \
            "/p:AssemblyVersion=$v" \
            /p:Configuration=Release

      - name: NuGet login
        id: login
        uses: NuGet/login@v1
        with:
          user: Siarhei_Kuchuk

      - name: Push to NuGet.org
        run: |
          pkg=$(find output/nuget-package -name '*.nupkg' | head -1)
          if [ -z "$pkg" ]; then
            echo "Error: no .nupkg produced"
            exit 1
          fi
          echo "Pushing $pkg"
          dotnet nuget push "$pkg" \
            --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" \
            --source https://api.nuget.org/v3/index.json
