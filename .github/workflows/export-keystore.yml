# One-shot: export ANDROID_KEYSTORE_* secrets as an encrypted archive.
# Public repo: never upload the raw keystore. Set KEYSTORE_RECOVERY_PASSWORD first
# (a new password you know), run this workflow, download the artifact, decrypt locally,
# then delete this workflow file and the artifact.
#
# Decrypt (Git Bash / OpenSSL):
#   openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -in keystore-recovery.tar.gz.enc -out keystore-recovery.tar.gz
#   tar xzf keystore-recovery.tar.gz

name: Export Android keystore

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Pack keystore and encrypt
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEYSTORE_RECOVERY_PASSWORD: ${{ secrets.KEYSTORE_RECOVERY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${KEYSTORE_RECOVERY_PASSWORD:-}" ]; then
            echo "Add repository secret KEYSTORE_RECOVERY_PASSWORD, then run this workflow again."
            exit 1
          fi
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "$name is missing."
              exit 1
            fi
          done
          mkdir -p recovery
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > recovery/ftpsserver-release.keystore
          {
            printf 'ANDROID_KEY_ALIAS=%s\n' "$ANDROID_KEY_ALIAS"
            printf 'ANDROID_KEYSTORE_PASSWORD=%s\n' "$ANDROID_KEYSTORE_PASSWORD"
            printf 'ANDROID_KEY_PASSWORD=%s\n' "$ANDROID_KEY_PASSWORD"
          } > recovery/passwords.txt
          tar -C recovery -czf - . \
            | openssl enc -aes-256-cbc -pbkdf2 -iter 200000 -salt \
                -out keystore-recovery.tar.gz.enc \
                -pass env:KEYSTORE_RECOVERY_PASSWORD
          rm -rf recovery

      - uses: actions/upload-artifact@v4
        with:
          name: keystore-recovery
          path: keystore-recovery.tar.gz.enc
          retention-days: 1
